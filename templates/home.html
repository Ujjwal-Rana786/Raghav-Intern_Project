<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raghav - Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            animation: bgChange 20s infinite alternate ease-in-out;
            background: linear-gradient(120deg, #90caf9, #e3f2fd, #bbdefb);
            transition: background 1s ease;
        }

        @keyframes bgChange {
            0% { background: linear-gradient(120deg, #90caf9, #e3f2fd, #bbdefb); }
            25% { background: linear-gradient(120deg, #a5d6a7, #dcedc8, #81c784); }
            50% { background: linear-gradient(120deg, #ffe082, #fff8e1, #ffcc80); }
            75% { background: linear-gradient(120deg, #f48fb1, #fce4ec, #f06292); }
            100% { background: linear-gradient(120deg, #b39ddb, #ede7f6, #7e57c2); }
        }

        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 25px 50px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            height: 85px;
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-box img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            margin-right: 12px;
            object-fit: cover;
            border: 2px solid #007BFF;
            transition: transform 0.3s ease;
        }

        .logo-box img:hover {
            transform: scale(1.1);
        }

        header .logo {
            font-weight: 700;
            font-size: 24px;
            color: #007BFF;
        }

        header nav {
            display: flex;
            flex-wrap: wrap;
        }

        header nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 18px;
            transition: color 0.3s, transform 0.3s;
            position: relative;
        }

        header nav a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: #007BFF;
            transition: width 0.3s ease;
        }

        header nav a:hover::after {
            width: 100%;
        }

        header nav a:hover {
            color: #007BFF;
            transform: translateY(-2px);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 40px;
        }

        .profile-img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #007BFF;
            box-shadow: 0 6px 15px rgba(0,123,255,0.3);
            margin-bottom: 25px;
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .profile-img:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0,123,255,0.5);
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 30px;
            animation: fadeSlide 2s ease forwards;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        a.button {
            display: inline-block;
            background-color: #007BFF;
            color: #fff;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.4s, transform 0.4s, box-shadow 0.4s;
            animation: btnPop 2s ease infinite alternate;
        }

        @keyframes btnPop {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); box-shadow: 0 6px 15px rgba(0,123,255,0.4); }
        }

        a.button:hover {
            background-color: #0056b3;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            header nav a { margin-left: 20px; font-size: 16px; }
            h1 { font-size: 28px; }
            header { height: auto; padding: 15px 20px; }
        }

        @media (max-width: 480px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                height: auto;
                padding: 12px 8px;
            }
            .logo-box img {
                width: 40px;
                height: 40px;
            }
            header nav {
                margin-top: 10px;
                flex-wrap: wrap;
            }
            header nav a {
                margin: 5px 10px;
                font-size: 14px;
            }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-box">
          <!-- <img src="profile.jpg" alt="Raghav Profile Picture">--> 
            <div class="logo">Raghav</div>
        </div>
        <nav>
            <a href="/aboutUs">About Me</a>
            <a href="/aboutCodroid">CodroidHub</a>
            <a href="https://github.com/Annant123" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/raghavdutta?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app" target="_blank">LinkedIn</a>
            <a href="/blogs">Blogs</a>
        </nav>
    </header>

    <main>
         <!-- <img src="profile.jpg" alt="Raghav Portrait" class="profile-img">--> 
        <h1>Welcome to My Data Science Portfolio</h1>
        <a class="button" href="/explore">Explore More</a>
    </main>
</body>
</html>
