<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_name }} - Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #f4f6f8; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        header { background: #fff; padding: 15px 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        header .logo { font-weight: bold; font-size: 18px; color: #007BFF; }
        header nav { display: flex; flex-wrap: wrap; }
        header nav a { margin-left: 20px; text-decoration: none; color: #333; font-weight: 500; transition: color 0.3s ease; }
        header nav a:hover { color: #007BFF; }

        /* Main Section */
        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        main img { width: 120px; margin-bottom: 20px; }
        h1 { font-size: 32px; margin-bottom: 10px; }
        p { font-size: 16px; color: #555; margin-bottom: 20px; }

        /* Back Button */
        a.button { display: inline-block; background-color: #007BFF; color: #fff; padding: 10px 20px; font-size: 14px; font-weight: 600; border-radius: 6px; text-decoration: none; transition: background-color 0.3s ease, transform 0.2s ease; }
        a.button:hover { background-color: #0056b3; transform: translateY(-2px); }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 24px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">CodroidHub</div>
        <nav>
            <a href="/">Home</a>
            <a href="/explore">Explore</a>
            <a href="/aboutUs">About Us</a>
            <a href="/aboutCodroid" target="_blank">CodroidHub</a>
            <a href="https://github.com/Annant123" target="_blank">GitHub</a>
            <a href="https://www.linkedin.com/in/annant-dahiya-4ba65022b/" target="_blank">LinkedIn</a>
            <a href="/blogs">Blogs</a>
        </nav>
    </header>

    <main>
        <img src="https://cdn-icons-png.flaticon.com/512/2910/2910768.png" alt="Coming Soon Icon">
        <h1>{{ page_name }} - Coming Soon</h1>
        <p>We’re working hard to bring you an amazing {{ page_name }} experience. Stay tuned!</p>
        <a class="button" href="{{ url_for('explore') }}">Back to Explore</a>
    </main>
</body>
</html>
